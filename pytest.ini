[pytest]
testpaths = tests
# Временные файлы проверок создаются внутри проекта, а не в системном каталоге:
# на Windows доступ к %LOCALAPPDATA%\Temp\pytest-of-<пользователь> бывает закрыт
# правами, и проверки падают с WinError 5 по причине, не связанной с кодом.
# Каталог служебный, pytest очищает его при каждом запуске.
addopts = --basetemp=.pytest-tmp
